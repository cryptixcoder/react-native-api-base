packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  '@parcel/watcher': true
  '@swc/core': true
  msgpackr-extract: false
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/ui@57.0.21'
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo-router@57.0.24
  - expo@57.0.26
# Native modules must exist in exactly one version (expo-doctor). Keep transitive copies on the app's version.
overrides:
  expo-constants: 57.0.20
